# config.example.yaml — Пример фрагмента конфигурации ручных переопределений эмитентов
#
# ВНИМАНИЕ: Этот файл содержит ТОЛЬКО фрагмент конфигурации для секции company_overrides!
# Не копируйте этот файл целиком поверх config.yaml (загрузчик читает только config.yaml в корне проекта).
# Скопируйте нужную секцию `company_overrides:` в ваш существующий config.yaml.
#
# Безопасный workflow применения переопределений:
#   1. Добавьте или измените секцию company_overrides в config.yaml
#   2. Проверьте результат группировки без записи в базу данных:
#        python3 main.py link-companies --report
#   3. Осознанно примените изменения ко всему каталогу облигаций (перепривязывает уже связанные облигации):
#        python3 main.py link-companies --all
#
# Правила сопоставления:
#   - Ключ: точное исходное название выпуска (например, "Газпром БО-22") ЛИБО имя после нормализации
#     (например, "Газпром"). Точное название выпуска имеет приоритет.
#   - Значение:
#       1) строка: каноническое имя компании (тип сущности определяется автоматически: company);
#       2) словарь с полями `name` (каноническое имя) и `entity_type`.
#          Допустимые типы entity_type: company, individual, region, sovereign.
#   - Важно: поле `inn` в overrides в текущей версии не поддерживается при привязке к БД
#     (ИНН поступает из API по ISIN), поэтому не указывайте inn в переопределениях.
#   - Все ключи и строковые значения в примере указываются в кавычках.

company_overrides:
  # Вариант 1: Строка с каноническим именем (слияние вариантов названия в единое имя)
  "МФК Быстроденьги": "Быстроденьги"

  # Вариант 2: Словарь с указанием канонического имени и явного типа сущности
  "Газпром":
    name: "Газпром Капитал"
    entity_type: "company"

  # Пример точного названия выпуска (имеет наивысший приоритет над нормализованным именем):
  "ЭР-Телеком Холдинг выпуск 3": "ЭР-Телеком Холдинг"

  # Пример региона или суверенного эмитента при нестандартном названии выпуска:
  "Субъект РФ Примерный 01":
    name: "Примерная область"
    entity_type: "region"
