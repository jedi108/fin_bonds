[project]
name = "portfolio_analyzer"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "tinkoff-invest[grpc]",
    "gspread",
    "google-auth-oauthlib",
    "openpyxl",
    "tabulate",
    "tqdm",
    "ics"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta" 